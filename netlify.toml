# Netlify hosts a read-only preview of the dashboard using the committed sample data.
# The tracker itself (auth, daily fetch, live data) runs locally with `npm start`.
[build]
  command = "node scripts/build-preview.js"
  publish = ".preview"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/ranks"
  to = "/api/ranks.json"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/tiers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
