name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same steps as `npm run deploy`: build .preview/, then wrangler deploy (version pinned as in package.json).
      - name: Build preview
        run: node scripts/build-preview.js
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          command: deploy
      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler-action returned no deployment-url"
            exit 1
          fi
          base="${DEPLOY_URL%/}"
          for path in "" "/api/ranks"; do
            code=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || true)
              [ "$code" = "200" ] && break
              echo "attempt $attempt: $base$path -> $code"
              sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "::error::$base$path returned $code (expected 200)"
              exit 1
            fi
            echo "OK $base$path"
          done
